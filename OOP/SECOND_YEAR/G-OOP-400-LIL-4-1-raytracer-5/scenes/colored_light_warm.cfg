# Warm directional light on the same setup as colored_light_white.cfg
camera:
{
    resolution = { width = 800.0; height = 800.0; };
    position = { x = 0.0; y = 0.2; z = 0.0; };
    rotation = { x = 0.0; y = 0.0; z = 0.0; };
    fieldOfView = 72.0;
};

materials = (
    { name = "white"; type = "mat"; color = { r = 255; g = 255; b = 255; }; },
    { name = "gray"; type = "mat"; color = { r = 180; g = 180; b = 180; }; }
);

primitives:
{
    spheres = (
        { x = 0.0; y = 0.2; z = -3.0; r = 0.8; material = "white"; }
    );

    planes = (
        { x = 0.0; y = -0.8; z = 0.0; normal = { x = 0.0; y = 1.0; z = 0.0; }; material = "gray"; }
    );
};

lights:
{
    directional = (
        {
            x = 0.8;
            y = -1.0;
            z = 0.3;
            intensity = 0.90;
            color = { r = 255; g = 210; b = 150; };
        }
    );
};
