# Two colored directional lights to show color mixing
camera:
{
    resolution = { width = 500.0; height = 500.0; };
    position = { x = 0.0; y = 0.2; z = 0.0; };
    rotation = { x = 0.0; y = 0.0; z = 0.0; };
    fieldOfView = 72.0;
};

materials = (
    { name = "white"; type = "mat"; color = { r = 255; g = 255; b = 255; }; },
    { name = "red"; type = "mat"; color = { r = 255; g = 70; b = 70; }; },
    { name = "blue"; type = "mat"; color = { r = 80; g = 120; b = 255; }; },
    { name = "gray"; type = "mat"; color = { r = 180; g = 180; b = 180; }; }
);

primitives:
{
    spheres = (
        { x = -1.0; y = 0.15; z = -3.2; r = 0.65; material = "red"; },
        { x = 0.0; y = 0.15; z = -2.6; r = 0.65; material = "white"; },
        { x = 1.0; y = 0.15; z = -3.2; r = 0.65; material = "blue"; }
    );

    planes = (
        { x = 0.0; y = -0.8; z = 0.0; normal = { x = 0.0; y = 1.0; z = 0.0; }; material = "gray"; }
    );
};

lights:
{
    directional = (
        {
            x = -1.0;
            y = -1.0;
            z = 0.2;
            intensity = 0.75;
            color = { r = 255; g = 80; b = 80; };
        },
        {
            x = 1.0;
            y = -1.0;
            z = 0.2;
            intensity = 0.75;
            color = { r = 80; g = 140; b = 255; };
        }
    );
};
